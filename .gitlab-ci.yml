# GitLab CI/CD Pipeline for Wordle Kata
#
# This pipeline builds and pushes the devcontainer image so team members
# can immediately start coding when they open the project in VS Code.
#

stages:
  - build

variables:
  DEVCONTAINER_IMAGE: $CI_REGISTRY_IMAGE/devcontainer
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

build-devcontainer:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building devcontainer image..."
    - cd .devcontainer
    - |
      docker build \
        --cache-from $DEVCONTAINER_IMAGE:latest \
        --tag $DEVCONTAINER_IMAGE:$CI_COMMIT_SHA \
        --tag $DEVCONTAINER_IMAGE:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        .
    - echo "Pushing devcontainer image..."
    - docker push $DEVCONTAINER_IMAGE:$CI_COMMIT_SHA
    - docker push $DEVCONTAINER_IMAGE:latest
    - echo "Done! Image available at $DEVCONTAINER_IMAGE:latest"
  rules:
    # Auto-build when devcontainer files change on main
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - .devcontainer/**/*
    # Manual trigger always available on main
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  tags:
    - docker
