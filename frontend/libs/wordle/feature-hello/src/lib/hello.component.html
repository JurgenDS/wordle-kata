<div class="hello-container">
  <p-card class="hello-card">
    <ng-template pTemplate="header">
      <div class="hello-card__header">
        <p class="hello-card__title">Hello World Demo</p>
      </div>
    </ng-template>

    <div class="form-group">
      <label class="field-label" for="nameInput">Enter your name</label>
      <input
        pInputText
        id="nameInput"
        type="text"
        [value]="name()"
        (input)="updateName($event)"
        class="name-input"
      />
    </div>

    <div class="cta-row">
      <button
        pButton
        type="button"
        (click)="fetchGreeting()"
        [disabled]="loading()"
        [loading]="loading()"
        class="fetch-button"
      >
        <span class="pi pi-send" aria-hidden="true"></span>
        <span class="label">Get Greeting</span>
      </button>
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" class="error-message" />
    }

    @if (greeting()) {
      <p-card class="greeting-result">
        <h2>{{ greeting() }}</h2>
      </p-card>
    }
  </p-card>
</div>
