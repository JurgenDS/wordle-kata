# Gitleaks configuration file
# https://github.com/gitleaks/gitleaks

title = "Wordle Kata Gitleaks Config"

[extend]
# Use the default gitleaks config as base
useDefault = true

[allowlist]
# Paths to exclude from scanning
paths = [
    # Build outputs and caches
    '''^\.angular/''',
    '''^\.nx/''',
    '''^dist/''',
    '''^target/''',
    '''^coverage/''',
    '''^\.nyc_output/''',
    '''frontend/\.angular/''',
    '''frontend/dist/''',
    '''frontend/coverage/''',
    '''frontend/\.nx/''',
    '''backend/target/''',

    # Dependencies
    '''^node_modules/''',
    '''node_modules/''',

    # Environment files (local secrets, not committed to git)
    '''\.env$''',
    '''\.env\.local$''',
    '''\.env\..+\.local$''',

    # Lock files
    '''pnpm-lock\.yaml$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',

    # Test files (may contain mock data)
    '''\.cy\.ts$''',
    '''\.spec\.ts$''',
]

# Regexes to exclude from findings
regexes = [
    # Angular DI tokens (false positives)
    '''i0\.EnvironmentInjector''',
    '''token:\s*i\d+\.\w+''',
]
